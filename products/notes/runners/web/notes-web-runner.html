<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes WebAssembly Runner</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #151515;
      color: #e0e0e0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      display: grid;
      gap: 0.75rem;
    }

    canvas {
      width: 600px;
      height: 400px;
      border: 1px solid #555;
      image-rendering: pixelated;
      background: #202020;
    }

    .hint {
      max-width: 600px;
      line-height: 1.4;
      color: #b8b8b8;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="notes" width="600" height="400" tabindex="0" aria-label="Notes WebAssembly UI"></canvas>
    <div class="hint">
      Browser <strong>test harness</strong> only (not a development tool): blit
      the Wasm framebuffer and persist an opaque byte blob. All Notes product
      logic lives in notes-web.wasm.
    </div>
  </main>

  <script>
    // Browser test harness only — not a development tool; not product logic.
    const canvas = document.getElementById("notes");
    const ctx = canvas.getContext("2d");
    const storageKey = "machine-welcome.notes-web.records";
    const FB_W = 600;
    const FB_H = 400;
    const FB_ADDR = 0;
    const FB_BYTES = FB_W * FB_H * 4;
    const RECORDS_ADDR = 0xed000;
    const RECORDS_LIMIT = 0x1000;
    let instance;
    let memory;
    let imageData;

    function present() {
      const fb = new Uint8ClampedArray(memory.buffer, FB_ADDR, FB_BYTES);
      if (!imageData) imageData = new ImageData(FB_W, FB_H);
      imageData.data.set(fb);
      ctx.putImageData(imageData, 0, 0);
    }

    function loadStore() {
      const raw = localStorage.getItem(storageKey);
      if (!raw) return new Uint8Array();
      try {
        return Uint8Array.from(atob(raw), (ch) => ch.charCodeAt(0));
      } catch {
        return new Uint8Array();
      }
    }

    function persistStore(ptr, len) {
      const bytes = new Uint8Array(memory.buffer, ptr, len);
      localStorage.setItem(
        storageKey,
        btoa(String.fromCharCode(...bytes)),
      );
    }

    function pushRecordsAndLoad() {
      const blob = loadStore();
      const u8 = new Uint8Array(memory.buffer);
      const len = Math.min(blob.length, RECORDS_LIMIT);
      u8.fill(0, RECORDS_ADDR, RECORDS_ADDR + RECORDS_LIMIT);
      u8.set(blob.subarray(0, len), RECORDS_ADDR);
      instance.exports.load(len);
    }

    const imports = {
      notes: {
        present,
        // Unused by the product path; kept so the module instantiates.
        save(_ptr, _len) {},
        rewrite(ptr, len) {
          persistStore(ptr, len);
        },
      },
    };

    canvas.addEventListener("keydown", (event) => {
      if (!instance) return;
      if (event.key === "Backspace") {
        event.preventDefault();
        instance.exports.key(8);
        return;
      }
      if (event.key === "Enter") {
        event.preventDefault();
        instance.exports.key(13);
        return;
      }
      if (event.key.length === 1) {
        event.preventDefault();
        instance.exports.key(event.key.charCodeAt(0) & 0xff);
      }
    });

    canvas.addEventListener("click", (event) => {
      if (!instance) return;
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((event.clientX - rect.left) * (canvas.width / rect.width));
      const y = Math.floor((event.clientY - rect.top) * (canvas.height / rect.height));
      instance.exports.click(x, y);
      canvas.focus();
    });

    async function start() {
      const response = await fetch("/targets/wasm/notes-web.wasm");
      const bytes = await response.arrayBuffer();
      const result = await WebAssembly.instantiate(bytes, imports);
      instance = result.instance;
      memory = instance.exports.memory;
      instance.exports.init();
      pushRecordsAndLoad();
      canvas.focus();
    }

    start().catch((error) => {
      ctx.fillStyle = "#202020";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff8080";
      ctx.font = "16px monospace";
      ctx.fillText(`Failed to load notes-web.wasm: ${error.message}`, 16, 32);
      console.error(error);
    });
  </script>
</body>
</html>
